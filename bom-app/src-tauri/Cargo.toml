[package]
name = "bom-app"
version.workspace = true
description = "Standalone Populate/Generate BOM tool (Tauri) for kicad-auto-importer — a priced, multi-vendor (Mouser/DigiKey) bill-of-materials companion to the kicad-auto-importer desktop app, sharing its core import/lookup/pricing logic."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bom_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kicad-auto-importer-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target."cfg(target_os = \"linux\")".dev-dependencies]
tempfile = "3"

