[package]
name = "kicad-auto-importer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core KiCad source-file primitives shared by kicad-auto-importer and bom-app: S-expression parsing, .kicad_sym/.kicad_sch handling, and project/library-table resolution."
readme = "../../README.md"
keywords = ["kicad", "eda", "electronics", "footprint", "schematic"]
categories = ["parser-implementations", "filesystem"]

[dependencies]
serde_json = "1"
regex = "1"
dirs = "6"
thiserror = "2"
tempfile = "3"
sysinfo = { version = "0.39", optional = true }

[features]
kicad-process = ["dep:sysinfo"]

