[package]
name = "kicad-auto-importer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Desktop GUI that watches a folder for KiCad part-provider downloads (UltraLibrarian/Mouser/DigiKey) and imports them into your project's libraries automatically."
readme = "../../README.md"
keywords = ["kicad", "eda", "gui", "footprint", "importer"]
categories = ["gui", "development-tools"]

[dependencies]
kicad-auto-importer-core.workspace = true
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
egui-phosphor = "0.7"
rfd = "0.15"
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "ico",
] }
chrono = { version = "0.4" }
# `libxdo` (tray-icon's default) is only needed for the predefined
# Copy/Cut/Paste/Select-All menu items, which this app's tray menu
# doesn't use — skipping it avoids a `libxdo-dev` build dependency on
# Linux for nothing.
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
interprocess = "2.4.2"

[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"

[target."cfg(target_os = \"linux\")".dev-dependencies]
tempfile = "3"

[target."cfg(windows)".build-dependencies]
ab_glyph = "0.2.32"
egui-phosphor = "0.7"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "ico",
] }
winresource = "0.1.31"
