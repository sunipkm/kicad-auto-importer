name: test

on:
  workflow_call:
    inputs:
      build_release:
        description: >-
          Also build --release for this job's target(s), package into an
          archive, and upload it as an artifact — used by release.yml so
          the tag-triggered release build reuses the same toolchain setup
          this job already pays for, instead of a separate job repeating it.
        type: boolean
        default: false

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: [x86_64-unknown-linux-gnu]
            archive_ext: tar.gz
          - os: macos-latest
            # Apple Silicon only — an x86_64 build isn't worth shipping
            # alongside it: Intel Macs are a shrinking minority, and (per
            # the ad-hoc codesign step below) every build still needs a
            # manual right-click > Open past Gatekeeper's "unidentified
            # developer" prompt once anyway, since there's no paid
            # Developer ID for notarization — doubling that friction for
            # a shrinking platform isn't worth the build.
            targets: [aarch64-apple-darwin]
            archive_ext: dmg
          - os: windows-latest
            targets: [x86_64-pc-windows-msvc]
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ join(matrix.targets, ',') }}
      - uses: Swatinem/rust-cache@v2
      # Linux-only build dependencies: GTK3 + libayatana-appindicator for
      # the `tray-icon` crate (system tray icon + menu, see
      # crates/app/src/tray.rs), plus everything Tauri needs to compile
      # `bom-app` (see bom-app/BUILD.md's own "Prerequisites" — this
      # list must stay in sync with that one). macOS/Windows use their
      # native tray/webview APIs instead and need nothing extra here.
      - name: Install Linux build dependencies (tray icon + bom-app/Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev

      # Every workspace member is compiled by the fmt/clippy/test steps
      # below — including `bom-app`, whose `tauri::generate_context!()`
      # embeds `frontendDist` (`bom-app/dist/`, see tauri.conf.json) at
      # *compile* time and hard-errors if that directory doesn't exist
      # yet. The frontend has to be built before any `cargo` command
      # touches the workspace, not just before packaging a release.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bom-app/package-lock.json
      - name: Install bom-app frontend dependencies
        working-directory: bom-app
        run: npm ci
      - name: Build bom-app frontend
        working-directory: bom-app
        run: npm run build

      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

      # Freshly-compiled, unsigned Rust binaries are a well-documented
      # Windows Defender false-positive magnet (heuristic detections like
      # "Trojan:Win32/Wacatac.B!ml" — see rust-lang/rust#88297); real-time
      # protection quarantining/deleting the .exe shortly after it's
      # built would explain `makensis` later failing to find it even
      # though it ran successfully seconds earlier in the same CI run.
      # `-ErrorAction SilentlyContinue`: purely defensive, so this never
      # breaks the build on a runner image where the cmdlet behaves
      # differently or isn't needed.
      - name: Exclude target/ from Windows Defender scanning
        if: inputs.build_release && matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target" -ErrorAction SilentlyContinue

      - name: Build release binaries
        if: inputs.build_release
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ join(matrix.targets, ' ') }}; do
            cargo build --release --target "$target" -p kicad-auto-importer
            cargo build --release --target "$target" -p kicad-bom
          done

      - name: Package release archives (linux)
        if: inputs.build_release && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ join(matrix.targets, ' ') }}; do
            # Both kicad-auto-importer and kicad-bom-app ship as bare
            # binaries rather than .deb/.AppImage — both self-register
            # their own `.desktop` entries and icons on first run
            # (see linux_desktop_integration.rs), so they're packaged
            # together into a single archive.
            tar czf "kicad-autotools-$target.tar.gz" \
              -C "target/$target/release" kicad-auto-importer kicad-bom-app
          done

      # macOS ships as a proper double-clickable `.app`, not a bare
      # binary — built straight from the release binary's own
      # `--emit-iconset` output (see `crates/app/src/icon.rs`), so the
      # bundle's icon always matches whatever the app itself renders as
      # its window/dock icon, with nothing to keep in sync by hand.
      - name: Build macOS .app bundle(s)
        if: inputs.build_release && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for target in ${{ join(matrix.targets, ' ') }}; do
            release_dir="target/$target/release"
            app_dir="$release_dir/KiCad Auto Importer.app"
            mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
            cp "$release_dir/kicad-auto-importer" "$app_dir/Contents/MacOS/kicad-auto-importer"

            "$release_dir/kicad-auto-importer" --emit-iconset "$release_dir/AppIcon.iconset"
            iconutil -c icns "$release_dir/AppIcon.iconset" -o "$app_dir/Contents/Resources/AppIcon.icns"

            # Built with `plutil` (preinstalled on every macOS runner)
            # rather than a heredoc: a multi-line here-doc's closing
            # delimiter has to sit at column zero with no leading
            # whitespace at all, which a YAML block scalar's own
            # indentation requirement makes impossible to satisfy here.
            plist="$app_dir/Contents/Info.plist"
            plutil -create xml1 "$plist"
            plutil -insert CFBundleName -string "KiCad Auto Importer" "$plist"
            plutil -insert CFBundleDisplayName -string "KiCad Auto Importer" "$plist"
            plutil -insert CFBundleIdentifier -string "com.sunipkm.kicad-auto-importer" "$plist"
            plutil -insert CFBundleVersion -string "$version" "$plist"
            plutil -insert CFBundleShortVersionString -string "$version" "$plist"
            plutil -insert CFBundlePackageType -string "APPL" "$plist"
            plutil -insert CFBundleExecutable -string "kicad-auto-importer" "$plist"
            plutil -insert CFBundleIconFile -string "AppIcon" "$plist"
            plutil -insert CFBundleInfoDictionaryVersion -string "6.0" "$plist"
            plutil -insert LSMinimumSystemVersion -string "11.0" "$plist"
            plutil -insert NSHighResolutionCapable -bool true "$plist"

            # Ad-hoc sign (no paid Developer ID, so no notarization
            # either — see the matrix comment above): without *any*
            # signature, Gatekeeper on Apple Silicon refuses to run the
            # bundle at all once quarantined (macOS requires a valid
            # signature, even ad-hoc, to execute arm64 code) and reports
            # it as "damaged" rather than the older, bypassable
            # "unidentified developer" prompt. Ad-hoc signing fixes
            # "damaged"; users still have to right-click > Open (or clear
            # the quarantine xattr) once, since it's not notarized. Must
            # run last: signing anything earlier and then still copying
            # files into the bundle (icon, Info.plist) would invalidate it.
            codesign --force --deep --sign - "$app_dir"
          done

      # kicad-bom-app's own `.app`, built by hand the same way as
      # kicad-auto-importer's above (not via `tauri build`'s own macOS
      # bundler) so both go through one well-understood, already-proven
      # pipeline rather than two different ones — the only real
      # difference is the icon: kicad-bom-app already ships a ready-made
      # `icon.icns` (`bom-app/src-tauri/icons/`), so there's no
      # `--emit-iconset` step to run first.
      - name: Build kicad-bom-app .app bundle(s)
        if: inputs.build_release && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for target in ${{ join(matrix.targets, ' ') }}; do
            release_dir="target/$target/release"
            app_dir="$release_dir/KiCad BOM Tool.app"
            mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
            cp "$release_dir/kicad-bom-app" "$app_dir/Contents/MacOS/kicad-bom-app"
            cp "bom-app/src-tauri/icons/icon.icns" "$app_dir/Contents/Resources/AppIcon.icns"

            plist="$app_dir/Contents/Info.plist"
            plutil -create xml1 "$plist"
            plutil -insert CFBundleName -string "KiCad BOM Tool" "$plist"
            plutil -insert CFBundleDisplayName -string "KiCad BOM Tool" "$plist"
            plutil -insert CFBundleIdentifier -string "com.sunipkm.kicadautoimporter.bomapp" "$plist"
            plutil -insert CFBundleVersion -string "$version" "$plist"
            plutil -insert CFBundleShortVersionString -string "$version" "$plist"
            plutil -insert CFBundlePackageType -string "APPL" "$plist"
            plutil -insert CFBundleExecutable -string "kicad-bom-app" "$plist"
            plutil -insert CFBundleIconFile -string "AppIcon" "$plist"
            plutil -insert CFBundleInfoDictionaryVersion -string "6.0" "$plist"
            plutil -insert LSMinimumSystemVersion -string "11.0" "$plist"
            plutil -insert NSHighResolutionCapable -bool true "$plist"

            # Same ad-hoc signing reasoning as kicad-auto-importer's own
            # .app above — must run last, after every file is in place.
            codesign --force --deep --sign - "$app_dir"
          done

      # A DMG rather than a bare `.tar.gz` of the `.app`: this is the
      # familiar "drag the app onto Applications" installer experience
      # macOS users expect, built with `create-dmg` (not preinstalled,
      # hence the `brew install` below) rather than hand-rolling
      # `hdiutil`/AppleScript window-layout automation ourselves.
      # Both apps are packaged into a single DMG per target.
      - name: Package macOS installer DMG(s)
        if: inputs.build_release && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg

          # Keep --window-size/--icon-size/the icon coordinates below in
          # sync with `icon::DMG_WINDOW_SIZE` in crates/app/src/icon.rs,
          # which this same image is rendered by.
          background_bin="target/aarch64-apple-darwin/release/kicad-auto-importer"
          "$background_bin" --emit-dmg-background dmg-background.png

          for target in ${{ join(matrix.targets, ' ') }}; do
            release_dir="target/$target/release"

            # create-dmg copies *everything* in its source folder into
            # the disk image, so both .apps need to be alone in a clean
            # staging directory first — `release_dir` itself is full of
            # unrelated build artifacts that would otherwise end up in the DMG too.
            staging_dir="target/$target/dmg-staging"
            rm -rf "$staging_dir"
            mkdir -p "$staging_dir"
            cp -R "$release_dir/KiCad Auto Importer.app" "$staging_dir/"
            cp -R "$release_dir/KiCad BOM Tool.app" "$staging_dir/"

            create-dmg \
              --volname "KiCad Autotools" \
              --background dmg-background.png \
              --window-size 660 400 \
              --icon-size 128 \
              --icon "KiCad Auto Importer.app" 90 170 \
              --icon "KiCad BOM Tool.app" 270 170 \
              --app-drop-link 450 170 \
              --no-internet-enable \
              "kicad-autotools-$target.dmg" \
              "$staging_dir"
          done

      # An NSIS installer rather than a bare `.exe`: Start Menu shortcut,
      # an uninstaller Add/Remove Programs can find, and a proper
      # install location — see packaging/windows/installer.nsi for why
      # it's a per-user (no admin/UAC) install, and for why this one
      # installer packages *both* kicad-auto-importer.exe and
      # bom-app.exe rather than shipping two separate installers. Unlike
      # the older windows-2022 image, windows-2025 (what `windows-latest`
      # now points to) dropped NSIS from its preinstalled software
      # (actions/runner-images#11754), so `makensis` needs an explicit
      # install here.
      - name: Install NSIS
        if: inputs.build_release && matrix.os == 'windows-latest'
        # `choco install` adds NSIS to the machine PATH via the registry,
        # but each workflow step runs as a fresh process spawned from the
        # job's already-cached environment, so that change isn't picked up
        # mid-job — later steps (like the bash one below invoking
        # `makensis`) would still fail to find it without this explicit
        # $GITHUB_PATH append.
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      # PowerShell, not bash: this step is Windows-only (no cross-platform
      # script to share with the Linux/macOS steps above), and every bug
      # this step went through — /NOCD being mangled by Git Bash's MSYS
      # argv translation, `pwd -W`'s stray \r, NSIS's `File` instruction
      # choking on forward slashes from a Unix-style `pwd` — came from
      # routing a native Win32 tool (makensis) through a POSIX-emulation
      # shell instead of just using Windows' own path conventions
      # natively via pwsh.
      - name: Package Windows installer(s)
        if: inputs.build_release && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          # NSIS's VIProductVersion directive requires a strictly
          # numeric "X.X.X.X" — strip any "-pre0"-style suffix (release
          # tags can have one; see the tag patterns this workflow's
          # caller, release.yml, triggers on) just for that directive,
          # while the full tag (via PRODUCT_VERSION) still shows up
          # everywhere else: the installer UI and Add/Remove Programs.
          $versionNumeric = $version -replace '-.*$', ''

          foreach ($target in ("${{ join(matrix.targets, ' ') }}" -split ' ')) {
            $releaseDir = "$env:GITHUB_WORKSPACE\target\$target\release"

            # kicad-auto-importer.exe is built with `windows_subsystem =
            # "windows"` in release mode (crates/app/src/main.rs) — a GUI-
            # subsystem binary, not a console app. $LASTEXITCODE is
            # documented as unreliable (frequently $null) for GUI-
            # subsystem executables launched via `&`, so don't trust it
            # here; verify success the way that actually matters instead —
            # by checking the file it's supposed to have produced.
            & "$releaseDir\kicad-auto-importer.exe" --emit-ico "$releaseDir\app.ico"

            # Fail fast with a clear message here rather than NSIS's more
            # opaque "no files found" if the exe/icon aren't where
            # expected — e.g. Windows Defender quarantining a freshly-
            # built, unsigned .exe is a known failure mode on these
            # runners (see the "Exclude target/ from Windows Defender
            # scanning" step above).
            Get-ChildItem $releaseDir
            $exePath = "$releaseDir\kicad-auto-importer.exe"
            $icoPath = "$releaseDir\app.ico"
            $bomExePath = "$releaseDir\kicad-bom-app.exe"
            if (-not (Test-Path $exePath)) {
              Write-Output "::error::kicad-auto-importer.exe missing from $releaseDir right before packaging"
              exit 1
            }
            if (-not (Test-Path $icoPath)) {
              Write-Output "::error::app.ico missing from $releaseDir after --emit-ico"
              exit 1
            }
            # kicad-bom-app.exe needs no separate --emit-ico: `tauri-build`
            # already embeds `bom-app/src-tauri/icons/icon.ico` as its
            # Windows resource icon at compile time, so its Start Menu
            # shortcut (installer.nsi) uses that instead.
            if (-not (Test-Path $bomExePath)) {
              Write-Output "::error::kicad-bom-app.exe missing from $releaseDir right before packaging"
              exit 1
            }

            $outFile = "KiCadAutotools-Setup-$target.exe"
            $outFilePath = "$env:GITHUB_WORKSPACE\$outFile"

            makensis `
              "-DEXE_PATH=$exePath" `
              "-DICO_PATH=$icoPath" `
              "-DKICAD_BOM_APP_EXE_PATH=$bomExePath" `
              "-DPRODUCT_VERSION=$version" `
              "-DFILE_VERSION=$versionNumeric" `
              "-DOUT_FILE=$outFilePath" `
              packaging/windows/installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

            7z a "kicad-auto-importer-$target.zip" $outFile
            if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          }

      - uses: actions/upload-artifact@v4
        if: inputs.build_release
        with:
          name: kicad-autotools-${{ matrix.os }}
          path: |
            kicad-autotools-*.${{ matrix.archive_ext }}
            KiCadAutotools-Setup-*.exe
