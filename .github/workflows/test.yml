name: test

on:
  workflow_call:
    inputs:
      build_release:
        description: >-
          Also build --release for this job's target(s), package into an
          archive, and upload it as an artifact — used by release.yml so
          the tag-triggered release build reuses the same toolchain setup
          this job already pays for, instead of a separate job repeating it.
        type: boolean
        default: false

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: [x86_64-unknown-linux-gnu]
            archive_ext: tar.gz
          - os: macos-latest
            # Apple Silicon only — unsigned x86_64 builds aren't worth
            # shipping since Gatekeeper on Apple Silicon Macs marks even
            # the *native* aarch64 build "damaged" without a paid
            # Developer ID signature/notarization, and Intel Macs are a
            # shrinking minority besides.
            targets: [aarch64-apple-darwin]
            archive_ext: dmg
          - os: windows-latest
            targets: [x86_64-pc-windows-msvc]
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ join(matrix.targets, ',') }}
      - uses: Swatinem/rust-cache@v2
      # Linux-only build dependency of the `tray-icon` crate (system
      # tray icon + menu, see crates/app/src/tray.rs): GTK3 to create
      # the tray widget and libayatana-appindicator for the
      # StatusNotifierItem/AppIndicator protocol most desktop
      # environments actually render it through. macOS/Windows use
      # their native tray APIs instead and need nothing extra here.
      - name: Install tray icon build dependencies (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        if: inputs.build_release
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ join(matrix.targets, ' ') }}; do
            cargo build --release --target "$target" -p kicad-auto-importer
          done

      - name: Package release archive (linux)
        if: inputs.build_release && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ join(matrix.targets, ' ') }}; do
            tar czf "kicad-auto-importer-$target.tar.gz" \
              -C "target/$target/release" kicad-auto-importer
          done

      # macOS ships as a proper double-clickable `.app`, not a bare
      # binary — built straight from the release binary's own
      # `--emit-iconset` output (see `crates/app/src/icon.rs`), so the
      # bundle's icon always matches whatever the app itself renders as
      # its window/dock icon, with nothing to keep in sync by hand.
      - name: Build macOS .app bundle(s)
        if: inputs.build_release && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for target in ${{ join(matrix.targets, ' ') }}; do
            release_dir="target/$target/release"
            app_dir="$release_dir/KiCad Auto Importer.app"
            mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"
            cp "$release_dir/kicad-auto-importer" "$app_dir/Contents/MacOS/kicad-auto-importer"

            "$release_dir/kicad-auto-importer" --emit-iconset "$release_dir/AppIcon.iconset"
            iconutil -c icns "$release_dir/AppIcon.iconset" -o "$app_dir/Contents/Resources/AppIcon.icns"

            # Built with `plutil` (preinstalled on every macOS runner)
            # rather than a heredoc: a multi-line here-doc's closing
            # delimiter has to sit at column zero with no leading
            # whitespace at all, which a YAML block scalar's own
            # indentation requirement makes impossible to satisfy here.
            plist="$app_dir/Contents/Info.plist"
            plutil -create xml1 "$plist"
            plutil -insert CFBundleName -string "KiCad Auto Importer" "$plist"
            plutil -insert CFBundleDisplayName -string "KiCad Auto Importer" "$plist"
            plutil -insert CFBundleIdentifier -string "com.sunipkm.kicad-auto-importer" "$plist"
            plutil -insert CFBundleVersion -string "$version" "$plist"
            plutil -insert CFBundleShortVersionString -string "$version" "$plist"
            plutil -insert CFBundlePackageType -string "APPL" "$plist"
            plutil -insert CFBundleExecutable -string "kicad-auto-importer" "$plist"
            plutil -insert CFBundleIconFile -string "AppIcon" "$plist"
            plutil -insert CFBundleInfoDictionaryVersion -string "6.0" "$plist"
            plutil -insert LSMinimumSystemVersion -string "11.0" "$plist"
            plutil -insert NSHighResolutionCapable -bool true "$plist"
          done

      # A DMG rather than a bare `.tar.gz` of the `.app`: this is the
      # familiar "drag the app onto Applications" installer experience
      # macOS users expect, built with `create-dmg` (not preinstalled,
      # hence the `brew install` below) rather than hand-rolling
      # `hdiutil`/AppleScript window-layout automation ourselves.
      - name: Package macOS installer DMG(s)
        if: inputs.build_release && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg

          # Keep --window-size/--icon-size/the icon coordinates below in
          # sync with `icon::DMG_WINDOW_SIZE` in crates/app/src/icon.rs,
          # which this same image is rendered by.
          background_bin="target/aarch64-apple-darwin/release/kicad-auto-importer"
          "$background_bin" --emit-dmg-background dmg-background.png

          for target in ${{ join(matrix.targets, ' ') }}; do
            release_dir="target/$target/release"

            # create-dmg copies *everything* in its source folder into
            # the disk image, so the `.app` needs to be alone in a clean
            # staging directory first — `release_dir` itself is full of
            # unrelated build artifacts (the raw binary, AppIcon.iconset,
            # Info.plist, ...) that would otherwise end up in the DMG too.
            staging_dir="target/$target/dmg-staging"
            rm -rf "$staging_dir"
            mkdir -p "$staging_dir"
            cp -R "$release_dir/KiCad Auto Importer.app" "$staging_dir/"

            create-dmg \
              --volname "KiCad Auto Importer" \
              --background dmg-background.png \
              --window-size 660 400 \
              --icon-size 128 \
              --icon "KiCad Auto Importer.app" 180 170 \
              --app-drop-link 480 170 \
              --no-internet-enable \
              "kicad-auto-importer-$target.dmg" \
              "$staging_dir"
          done

      # An NSIS installer rather than a bare `.exe`: Start Menu shortcut,
      # an uninstaller Add/Remove Programs can find, and a proper
      # install location — see packaging/windows/installer.nsi for why
      # it's a per-user (no admin/UAC) install. Unlike the older
      # windows-2022 image, windows-2025 (what `windows-latest` now
      # points to) dropped NSIS from its preinstalled software
      # (actions/runner-images#11754), so `makensis` needs an explicit
      # install here.
      - name: Install NSIS
        if: inputs.build_release && matrix.os == 'windows-latest'
        run: choco install nsis -y --no-progress

      - name: Package Windows installer(s)
        if: inputs.build_release && matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # NSIS's VIProductVersion directive requires a strictly
          # numeric "X.X.X.X" — strip any "-pre0"-style suffix (release
          # tags can have one; see the tag patterns this workflow's
          # caller, release.yml, triggers on) just for that directive,
          # while the full tag (via PRODUCT_VERSION) still shows up
          # everywhere else: the installer UI and Add/Remove Programs.
          version_numeric="${version%%-*}"
          for target in ${{ join(matrix.targets, ' ') }}; do
            release_dir="target/$target/release"
            "$release_dir/kicad-auto-importer.exe" --emit-ico "$release_dir/app.ico"

            out_file="KiCadAutoImporter-Setup-$target.exe"
            makensis \
              "-DEXE_PATH=$release_dir/kicad-auto-importer.exe" \
              "-DICO_PATH=$release_dir/app.ico" \
              "-DPRODUCT_VERSION=$version" \
              "-DFILE_VERSION=$version_numeric" \
              "-DOUT_FILE=$out_file" \
              packaging/windows/installer.nsi

            7z a "kicad-auto-importer-$target.zip" "$out_file"
          done

      - uses: actions/upload-artifact@v4
        if: inputs.build_release
        with:
          name: kicad-auto-importer-${{ matrix.os }}
          path: kicad-auto-importer-*.${{ matrix.archive_ext }}
